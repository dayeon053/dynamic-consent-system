plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.consentradar'
version = '0.0.1-SNAPSHOT'
description = 'consentradar'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(23)
	}
}

// 한글 주석·문자열이 포함된 소스를 OS 기본 인코딩(예: Windows의 x-windows-949)이 아닌
// UTF-8로 컴파일하도록 강제한다 (common-model/build.gradle과 동일한 조치).
tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

repositories {
	mavenCentral()
}

dependencies {
	implementation project(':common-model')
	implementation 'com.fasterxml.jackson.core:jackson-databind'
	implementation 'org.jsoup:jsoup:1.17.2'
	implementation 'com.microsoft.playwright:playwright:1.61.0'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly 'com.h2database:h2'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'integration'
	}
}

// 로컬 실행 시 OPENAI_API_KEY 등을 매번 셸에서 export하지 않도록, 저장소 루트의 .env
// (git 미추적, .gitignore에 이미 포함됨)를 읽어 bootRun 실행 환경에 주입한다. 팀원은
// .env.example을 복사해 .env를 만들고 실제 키 값만 채워 넣으면 된다 — 이 파일에는 실제
// 비밀값이 없다.
tasks.named('bootRun') {
	def envFile = file('../../.env')
	if (envFile.exists()) {
		envFile.readLines().each { line ->
			line = line.trim()
			if (line && !line.startsWith('#') && line.contains('=')) {
				def idx = line.indexOf('=')
				def key = line.substring(0, idx).trim()
				def value = line.substring(idx + 1).trim()
				environment key, value
			}
		}
	}
}

tasks.register('integrationTest', Test) {
	description = '실제 로컬 MySQL(consentradar DB)이 필요한 통합 테스트만 실행한다.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'integration'
	}
	shouldRunAfter test
}
